<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>For You ❤️</title>

<style>
body {
  margin: 0;
  overflow: hidden;
  background: black;
  font-family: Arial, sans-serif;
}

canvas {
  display: block;
}

/* 💬 Text Styling */
.text {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  color: white;
  font-size: 22px;
  font-weight: 500;
  text-align: center;
  line-height: 1.6;
  max-width: 90%;
  opacity: 0;
  animation: fadeIn 3s ease-in forwards;
}

@keyframes fadeIn {
  to { opacity: 1; }
}
</style>
</head>

<body>

<!-- 💬 Apology Message -->
<div class="text">
  I'm really sorry… <br><br>
  I never meant to hurt you. <br>
  But if I did, please tell me what I can do to make it right. <br><br>
  Mai to hu hi thoda sa bhondu… <br>
  please maaf krdo na 🥺👉🏻👈🏻
</div>

<canvas id="canvas"></canvas>

<!-- 🎵 Background Music -->
<audio id="bgMusic" loop>
  <source src="1775250446366002.m4a" type="audio/mpeg">
</audio>

<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

// 🎵 Play music on first tap (mobile fix)
document.addEventListener("click", () => {
  document.getElementById("bgMusic").play();
}, { once: true });

// Resize canvas
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

window.addEventListener("resize", () => {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
});

let hearts = [];

// Create heart
function createHeart() {
  return {
    x: Math.random() * canvas.width,
    y: canvas.height + 20,
    size: Math.random() * 20 + 10,
    speed: Math.random() * 2 + 1,
    opacity: Math.random()
  };
}

// Initial hearts
for (let i = 0; i < 100; i++) {
  hearts.push(createHeart());
}

// Draw heart shape
function drawHeart(x, y, size, opacity) {
  ctx.globalAlpha = opacity;
  ctx.fillStyle = "pink";

  ctx.beginPath();
  ctx.moveTo(x, y);
  ctx.bezierCurveTo(x - size/2, y - size/2, x - size, y + size/3, x, y + size);
  ctx.bezierCurveTo(x + size, y + size/3, x + size/2, y - size/2, x, y);
  ctx.fill();

  ctx.globalAlpha = 1;
}

// Animation loop
function animate() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  hearts.forEach((heart, index) => {
    heart.y -= heart.speed;

    drawHeart(heart.x, heart.y, heart.size, heart.opacity);

    if (heart.y < -20) {
      hearts[index] = createHeart();
      hearts[index].y = canvas.height;
    }
  });

  requestAnimationFrame(animate);
}

animate();
</script>

</body>
</html>
