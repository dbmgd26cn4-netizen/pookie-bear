<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>For Aditi 🧸🤍</title>

<style>
body {
  margin: 0;
  overflow: hidden;
  background: radial-gradient(circle, #0f0f1a, #000);
  color: white;
  font-family: Arial;
  text-align: center;
}

h1 {
  font-size: 22px;
  margin-top: 20px;
  text-shadow: 0 0 8px pink;
}

/* 🌌 Stars */
.star {
  position: absolute;
  width: 2px;
  height: 2px;
  background: white;
  animation: twinkle 2s infinite;
}
@keyframes twinkle {
  0%,100% {opacity: 0.2;}
  50% {opacity: 1;}
}

/* 🌠 Shooting stars */
.shoot {
  position: absolute;
  width: 3px;
  height: 3px;
  background: white;
  animation: shoot 2s linear;
}
@keyframes shoot {
  to { transform: translate(-600px, 600px); }
}

/* 💕 Floating hearts */
.heart {
  position: absolute;
  bottom: -50px;
  font-size: 20px;
  animation: float 6s linear;
}
@keyframes float {
  to { transform: translateY(-800px); opacity: 0; }
}

/* 💖 Tap effects */
.tapHeart {
  position: absolute;
  font-size: 20px;
  animation: explode 1s ease-out forwards;
}
@keyframes explode {
  to {
    transform: translateY(-100px) scale(1.5);
    opacity: 0;
  }
}

/* 📸 Photo */
#photo {
  width: 200px;
  height: 200px;
  object-fit: cover;
  border-radius: 20px;
  margin-top: 15px;
  display: none;
  box-shadow: 0 0 20px pink;
  transition: opacity 1s;
}

/* 📸 Photo click animation */
.photo-animate {
  animation: pop 0.4s ease;
}
@keyframes pop {
  0% { transform: scale(1); }
  50% { transform: scale(1.2); }
  100% { transform: scale(1); }
}

/* 💬 Chat */
#chat {
  display: none;
  position: fixed;
  bottom: 10px;
  width: 100%;
}
.msg {
  background: rgba(255,255,255,0.1);
  backdrop-filter: blur(5px);
  padding: 8px;
  margin: 5px auto;
  border-radius: 12px;
  width: 80%;
  font-size: 14px;
}

/* 💌 Letter */
#letter {
  display: none;
  margin-top: 10px;
  padding: 10px;
  font-size: 16px;
  line-height: 1.6;
}

/* 🤗 Hug */
#hugBtn {
  display: none;
  padding: 10px 16px;
  border-radius: 20px;
  border: none;
  background: pink;
  cursor: pointer;
}

/* 🎮 Game */
.gameBtn {
  position: absolute;
  padding: 10px;
  border-radius: 50%;
  border: none;
  font-size: 18px;
  cursor: pointer;
}

/* 🌌 Name */
#name {
  position: absolute;
  top: 12%;
  width: 100%;
  font-size: 24px;
  letter-spacing: 2px;
  color: rgba(255,255,255,0.8);
  text-shadow: 0 0 10px pink, 0 0 20px pink;
  opacity: 0;
  transition: 2s;
}
</style>
</head>

<body>

<h1 id="text">Tap to enter Aditi’s Universe 🧸</h1>
<button onclick="start()">Enter 🤍</button>

<div id="name">Aditi 🧸🤍</div>

<img id="photo">
<div id="letter"></div>
<button id="hugBtn" onclick="hug()">🤗 Hug Me</button>

<div id="chat"></div>

<audio id="music" loop preload="auto">
  <source src="music.mp3" type="audio/mpeg">
  <source src="1775250446366002.m4a" type="audio/mp4">
</audio>

<script>

/* 🌌 Stars */
for (let i = 0; i < 120; i++) {
  let s = document.createElement("div");
  s.className = "star";
  s.style.top = Math.random() * innerHeight + "px";
  s.style.left = Math.random() * innerWidth + "px";
  document.body.appendChild(s);
}

/* 🌠 Shooting stars */
setInterval(() => {
  let s = document.createElement("div");
  s.className = "shoot";
  s.style.top = Math.random() * 200 + "px";
  s.style.left = innerWidth + "px";
  document.body.appendChild(s);
  setTimeout(() => s.remove(), 2000);
}, 3000);

/* 💕 Floating hearts */
function startHearts() {
  setInterval(() => {
    let h = document.createElement("div");
    h.className = "heart";
    h.innerHTML = "💖";
    h.style.left = Math.random() * innerWidth + "px";
    document.body.appendChild(h);
    setTimeout(() => h.remove(), 6000);
  }, 300);
}

/* ✨ Sparkles */
setInterval(() => {
  let sparkle = document.createElement("div");
  sparkle.innerHTML = "✨";
  sparkle.style.position = "absolute";
  sparkle.style.left = Math.random() * innerWidth + "px";
  sparkle.style.top = Math.random() * innerHeight + "px";
  sparkle.style.fontSize = "14px";
  document.body.appendChild(sparkle);
  setTimeout(() => sparkle.remove(), 2000);
}, 500);

/* 💖 Tap effects */
document.addEventListener("click", (e) => {
  let emojis = ["💖","✨","🧸","💫"];
  for (let i = 0; i < 6; i++) {
    let h = document.createElement("div");
    h.className = "tapHeart";
    h.innerHTML = emojis[Math.floor(Math.random()*emojis.length)];
    h.style.left = e.clientX + "px";
    h.style.top = e.clientY + "px";
    document.body.appendChild(h);
    setTimeout(() => h.remove(), 1000);
  }
});

/* 📸 Photos */
const photos = [
  "IMG_3757.jpeg",
  "405F6892-62A1-4944-9219-DB8CEBCB8724.jpeg",
  "26F2BFCD-F847-4B58-9819-9227116A9932.jpeg",
  "22D15150-F119-4DA2-98D5-A544132EC335.jpeg"
];

let photoIndex = 0;

function showPhoto() {
  let img = document.getElementById("photo");
  img.style.opacity = 0;
  setTimeout(() => {
    img.style.display = "block";
    img.src = photos[photoIndex];
    img.style.opacity = 1;
    photoIndex = (photoIndex + 1) % photos.length;
  }, 500);
}

/* 💖 PHOTO REACTION */
document.getElementById("photo").addEventListener("click", () => {
  let img = document.getElementById("photo");

  img.classList.add("photo-animate");
  setTimeout(() => img.classList.remove("photo-animate"), 400);

  for (let i = 0; i < 10; i++) {
    let h = document.createElement("div");
    h.innerHTML = "💖";
    h.style.position = "absolute";
    h.style.left = (img.offsetLeft + img.width/2) + "px";
    h.style.top = (img.offsetTop + img.height/2) + "px";
    h.style.transition = "1s";
    document.body.appendChild(h);

    setTimeout(() => {
      h.style.transform = `translate(${Math.random()*200-100}px, ${Math.random()*200-100}px)`;
      h.style.opacity = 0;
    }, 10);

    setTimeout(() => h.remove(), 1000);
  }

  img.style.boxShadow = "0 0 40px hotpink";
  setTimeout(() => img.style.boxShadow = "0 0 20px pink", 400);

  document.getElementById("text").innerHTML =
    "Aditi looks so cute here 🧸💖";
});

/* 💬 Chat */
const messages = [
  "Hey Aditi… 🧸🤍",
  "I know I haven’t been there properly…",
  "And I’m really sorry for that…",
  "It was never because you don’t matter…",
  "You matter a lot to me 🤍"
];

function showChat() {
  let chat = document.getElementById("chat");
  chat.style.display = "block";

  let i = 0;
  let interval = setInterval(() => {
    if (i < messages.length) {
      let div = document.createElement("div");
      div.className = "msg";
      div.innerHTML = messages[i];
      chat.appendChild(div);
      i++;
    } else clearInterval(interval);
  }, 1500);
}

/* 💌 Letter */
function showLetter() {
  let l = document.getElementById("letter");
  l.style.display = "block";
  l.innerHTML = `
  You don’t have to be strong all the time… 🤍<br><br>
  I’m right here, always.<br><br>
  — Yours 🧸❤️
  `;
  document.getElementById("hugBtn").style.display = "inline-block";
}

/* 🤗 Hug */
function hug() {
  document.getElementById("text").innerHTML =
    "Come here 🥺🤍 *virtual hug* 🤗💖";
}

/* 🎮 Game */
function startGame() {
  for (let i = 0; i < 5; i++) {
    let btn = document.createElement("button");
    btn.innerHTML = "😄";
    btn.className = "gameBtn";

    btn.style.top = Math.random() * innerHeight + "px";
    btn.style.left = Math.random() * innerWidth + "px";

    btn.onmouseover = () => {
      btn.style.top = Math.random() * innerHeight + "px";
      btn.style.left = Math.random() * innerWidth + "px";
    };

    btn.onclick = () => {
      document.getElementById("text").innerHTML =
        "There’s that smile I love 🧸💖";
      btn.remove();
    };

    document.body.appendChild(btn);
  }
}

/* ▶️ START */
function start() {
  document.querySelector("button").remove();

 <audio id="music" loop preload="auto">
  <source src="music.mp3" type="audio/mpeg">
  <source src="1775250446366002.m4a" type="audio/mp4">
</audio>

  startHearts();
  showChat();

  setInterval(showPhoto, 3000);

  setTimeout(() => {
    document.getElementById("name").style.opacity = 1;
  }, 4000);

  setTimeout(showLetter, 6000);
  setTimeout(startGame, 8000);
}

</script>
</body>
</html>
